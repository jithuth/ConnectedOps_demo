name: Deploy ConnectedOps to AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Production Containers
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Test Suite
      run: |
        dotnet restore ConnectedOps.slnx
        dotnet test ConnectedOps.slnx -c Release --verbosity normal

    - name: Validate Docker Compose Configuration
      run: docker compose config -q

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Web Container
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/ConnectedOps.Web/Dockerfile
        push: false
        tags: connectedops-web:latest

    - name: Build API Container
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/ConnectedOps.Api/Dockerfile
        push: false
        tags: connectedops-api:latest

  deploy-to-ec2:
    name: Deploy to AWS EC2 Instance
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_EC2_HOST != '' }}

    steps:
    - name: Deploy updates via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.AWS_EC2_HOST }}
        username: ${{ vars.AWS_EC2_USER || 'ec2-user' }}
        key: ${{ secrets.AWS_EC2_SSH_KEY }}
        script: |
          cd /opt/connectedops
          git pull origin main
          docker compose build --pull
          docker compose up -d --remove-orphans
          echo "ConnectedOps successfully updated on AWS!"
