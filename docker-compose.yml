services:
  sql-server:
    build:
      context: .
      dockerfile: src/ConnectedOps.SqlServer/Dockerfile
    image: connectedops-sqlserver:latest
    container_name: connectedops-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ConnectedOps_StrongP@ssw0rd!2026}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "1280"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - connectedops-network

  connectedops-api:
    build:
      context: .
      dockerfile: src/ConnectedOps.Api/Dockerfile
    container_name: connectedops-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=ConnectedOpsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ConnectedOps_StrongP@ssw0rd!2026};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__SigningKey: "${JWT_SECRET:-SuperSecretKey_ConnectedOpsEnterprisePlatformKey2026_Minimum32BytesLong!}"
      Jwt__Key: "${JWT_SECRET:-SuperSecretKey_ConnectedOpsEnterprisePlatformKey2026_Minimum32BytesLong!}"
      Jwt__Issuer: "https://connectedops.io"
      Jwt__Audience: "https://connectedops.io"
      PlatformBootstrap__Enabled: "true"
      PlatformBootstrap__Email: "${SUPERADMIN_EMAIL:-admin@connectedops.io}"
      PlatformBootstrap__Password: "${SUPERADMIN_PASSWORD:-Admin123!SafePass2026}"
    ports:
      - "5000:8080"
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - connectedops-network

  connectedops-web:
    build:
      context: .
      dockerfile: src/ConnectedOps.Web/Dockerfile
    container_name: connectedops-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=ConnectedOpsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ConnectedOps_StrongP@ssw0rd!2026};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__SigningKey: "${JWT_SECRET:-SuperSecretKey_ConnectedOpsEnterprisePlatformKey2026_Minimum32BytesLong!}"
      Jwt__Key: "${JWT_SECRET:-SuperSecretKey_ConnectedOpsEnterprisePlatformKey2026_Minimum32BytesLong!}"
      Jwt__Issuer: "https://connectedops.io"
      Jwt__Audience: "https://connectedops.io"
      PlatformBootstrap__Enabled: "true"
      PlatformBootstrap__Email: "${SUPERADMIN_EMAIL:-admin@connectedops.io}"
      PlatformBootstrap__Password: "${SUPERADMIN_PASSWORD:-Admin123!SafePass2026}"
      ApiUrl: "http://connectedops-api:8080"
    ports:
      - "5001:8080"
    depends_on:
      sql-server:
        condition: service_healthy
      connectedops-api:
        condition: service_started
    networks:
      - connectedops-network

volumes:
  sql-data:
    driver: local

networks:
  connectedops-network:
    driver: bridge
